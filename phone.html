<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>手机控制器 · 尸潮突击</title>
<style>
  :root{ --bg:#0b0d12; --panel:#141824; --line:#262c3d; --accent:#ff5f4a; --accent2:#ffd60a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:#e7eaf0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
  body{display:flex;flex-direction:column;padding:14px;gap:12px;user-select:none;}
  .top{display:flex;align-items:center;gap:8px;font-size:13px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;flex:none;}
  .dot.on{background:#39d353;}
  .top .ip{color:#6b7180;margin-left:auto;font-size:11px;}
  .weapon-name{text-align:center;font-size:15px;color:#9aa0ab;}
  .weapon-name b{color:var(--accent2);font-size:22px;display:block;margin-top:2px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0;}
  .wbtn{border:1.5px solid var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:700;color:#cfd4dd;transition:transform .06s;}
  .wbtn:active{transform:scale(.94);}
  .wbtn .ico{font-size:34px;line-height:1;}
  .wbtn.sel{border-color:var(--accent);background:linear-gradient(160deg,rgba(255,95,74,.22),rgba(255,95,74,.05));color:#fff;box-shadow:0 0 24px rgba(255,95,74,.35);}
  .wbtn.sel .ico{filter:drop-shadow(0 0 8px rgba(255,95,74,.8));}
  .wbtn small{font-size:10px;font-weight:600;color:#ff8f8f;letter-spacing:0;}
  .wbtn.locked{opacity:.45;filter:grayscale(.7);}
  .wbtn.locked small{color:#ff6b6b;}
  #activate{margin-top:4px;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff5f4a,#d9230f);color:#fff;font-size:16px;font-weight:800;letter-spacing:.1em;}
  #activate.off{display:none;}
  .readout{font-size:11px;color:#6b7180;text-align:center;line-height:1.7;min-height:34px;}
  .readout b{color:#c9ced9;}
  .swing{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--accent2);opacity:0;}
  .swing.act{animation:pop .4s ease;}
  @keyframes pop{0%{opacity:0;transform:scale(.6);}30%{opacity:1;transform:scale(1.15);}100%{opacity:0;transform:scale(1.4);}}
</style>
</head>
<body>
  <div class="top">
    <div class="dot" id="dot"></div>
    <span id="status">连接中…</span>
    <span class="ip" id="ip"></span>
  </div>

  <div class="weapon-name">当前武器<b id="weaponName">拳头</b></div>

  <div class="grid">
    <button class="wbtn sel" data-w="fist"><span class="ico">👊</span>拳头</button>
    <button class="wbtn" data-w="gun"><span class="ico">🔫</span>双枪</button>
    <button class="wbtn locked" data-w="katana"><span class="ico">⚔️</span>武士刀<small>🔒 第3波</small></button>
    <button class="wbtn locked" data-w="staff"><span class="ico">🥢</span>长棍<small>🔒 第5波</small></button>
    <button class="wbtn locked" data-w="hammer"><span class="ico">🔨</span>战锤<small>🔒 第7波</small></button>
    <button class="wbtn locked" data-w="daggers"><span class="ico">🗡️</span>双匕首<small>🔒 第9波</small></button>
    <button class="wbtn locked" data-w="whip"><span class="ico">🪢</span>鞭子<small>🔒 第11波</small></button>
    <button class="wbtn locked" data-w="bow"><span class="ico">🏹</span>弓箭<small>🔒 第14波</small></button>
    <button class="wbtn locked" data-w="flail"><span class="ico">⛓️</span>流星锤<small>🔒 第17波</small></button>
  </div>

  <div class="readout" id="readout">等待传感器数据…</div>

  <button id="activate">点此激活体感传感器</button>

  <div class="swing" id="swingFx">⚡</div>

<script>
const $ = id => document.getElementById(id);
const dot = $('dot'), statusEl = $('status'), ipEl = $('ip');
const weaponName = $('weaponName'), readout = $('readout'), swingFx = $('swingFx');

const WEAPONS = { fist:'拳头', gun:'双枪', katana:'武士刀', staff:'长棍', hammer:'战锤', daggers:'双匕首', whip:'鞭子', bow:'弓箭', flail:'流星锤' };
const UNLOCK_WAVE = { katana:3, staff:5, hammer:7, daggers:9, whip:11, bow:14, flail:17 };
const locked = {};   // { w: true/false }，锁定的武器不可选
for (const w of Object.keys(WEAPONS)) locked[w] = UNLOCK_WAVE[w] ? true : false;
let weapon = 'fist';
let ws = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?role=phone');
  ws.onopen = () => { dot.classList.add('on'); statusEl.textContent = '已连接'; ipEl.textContent = location.host; };
  ws.onclose = () => { dot.classList.remove('on'); statusEl.textContent = '连接断开，重连中…'; setTimeout(connect, 1200); };
  ws.onerror = () => { statusEl.textContent = '连接错误'; };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (!m || !m.type) return;
    if (m.type === 'unlock') {
      if (!WEAPONS[m.w]) return;
      const isLocked = !m.unlocked;
      locked[m.w] = isLocked;
      const btn = document.querySelector('.wbtn[data-w="' + m.w + '"]');
      if (btn) {
        btn.classList.toggle('locked', isLocked);
        const sm = btn.querySelector('small');
        if (sm) sm.textContent = isLocked ? ('🔒 第' + (UNLOCK_WAVE[m.w] || '?') + '波') : '';
      }
      if (isLocked && weapon === m.w) selectWeapon('fist', false);
      statusEl.textContent = m.unlocked ? (WEAPONS[m.w] + '已解锁') : '已连接';
    } else if (m.type === 'weapon' && m.w && WEAPONS[m.w]) {
      selectWeapon(m.w, false);   // 电脑端切换同步到手机，不回发避免循环
    } else if (m.type === 'reset') {
      // 重开一局：所有武器重新锁定（拳/双枪保持可用）
      for (const w of Object.keys(WEAPONS)) locked[w] = UNLOCK_WAVE[w] ? true : false;
      document.querySelectorAll('.wbtn').forEach(btn => {
        const w = btn.dataset.w;
        const lk = !!locked[w];
        btn.classList.toggle('locked', lk);
        const sm = btn.querySelector('small');
        if (sm) sm.textContent = lk ? ('🔒 第' + UNLOCK_WAVE[w] + '波') : '';
      });
      selectWeapon('fist', false);
    }
  };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// 武器切换
function selectWeapon(w, relay) {
  document.querySelectorAll('.wbtn').forEach(b => b.classList.toggle('sel', b.dataset.w === w));
  weapon = w;
  weaponName.textContent = WEAPONS[w];
  if (relay !== false) send({ type:'weapon', w });
}
document.querySelectorAll('.wbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const w = btn.dataset.w;
    if (locked[w]) {
      statusEl.textContent = WEAPONS[w] + '：通关第' + UNLOCK_WAVE[w] + '波后解锁';
      return;
    }
    selectWeapon(w);
  });
});

// 传感器
let motionOn = false;
const GT = { gmag:0, amag:0, gamma:0, lastSwing:-1e9, lastSend:0 };

function onMotion(e) {
  const g = e.rotationRate || {};   // 陀螺仪角速度 °/s
  const gmag = Math.hypot(g.alpha||0, g.beta||0, g.gamma||0);
  const a = e.acceleration || {};   // 不含重力 m/s²
  let amag = Math.hypot(a.x||0, a.y||0, a.z||0);
  if (!a.x && !a.y && !a.z) {
    const ag = e.accelerationIncludingGravity || {};
    amag = Math.abs(Math.hypot(ag.x||0, ag.y||0, ag.z||0) - 9.8);
  }
  GT.gmag = gmag; GT.amag = amag;

  // 挥动检测：陀螺仪角速度突增（对旋转/挥动手臂最敏感）
  const now = performance.now();
  if (gmag > 350 && now - GT.lastSwing > 420) {
    GT.lastSwing = now;
    send({ type:'swing', w:weapon, mag:Math.round(gmag) });
    swingFx.classList.remove('act'); void swingFx.offsetWidth; swingFx.classList.add('act');
    if (navigator.vibrate) navigator.vibrate(40);
  }
}

function onOrient(e) {
  if (e.gamma != null) GT.gamma = e.gamma;   // -90~90，左右倾斜
}

// 高频发送 motion + tilt（30Hz）
setInterval(() => {
  if (!motionOn || !ws || ws.readyState !== 1) return;
  const now = performance.now();
  if (now - GT.lastSend < 33) return;
  GT.lastSend = now;
  send({ type:'motion', gm:GT.gmag.toFixed(0), am:GT.amag.toFixed(1), gamma:GT.gamma.toFixed(0) });
}, 33);

// 实时读数
setInterval(() => {
  readout.innerHTML = '角速度 <b>' + GT.gmag.toFixed(0) + '</b>°/s · 加速度 <b>' + GT.amag.toFixed(1) + '</b>m/s² · 倾斜 <b>' + GT.gamma.toFixed(0) + '</b>°<br/>快速挥动手机 = 攻击，左右倾斜 = 闪避';
}, 150);

async function activate() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') { alert('需要授权传感器才能体感操作'); return; }
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (e) { /* 安卓无需权限 */ }
  window.addEventListener('devicemotion', onMotion);
  window.addEventListener('deviceorientation', onOrient);
  motionOn = true;
  $('activate').classList.add('off');
  readout.textContent = '体感已激活，挥动手机试试！';
}

$('activate').addEventListener('click', activate);

// 未连上服务器时也能直接激活（本地调试）
connect();
</script>
</body>
</html>
